#####################################################################
#   Chamber Sensor
#####################################################################

[temperature_sensor chamber]
sensor_type:  Generic 3950
sensor_pin:   PF4

#####################################################################
#   Temperature Sensors
#####################################################################

[temperature_sensor MCU Temp]
sensor_type: temperature_mcu


[temperature_sensor PI4B]
sensor_type: temperature_host
#min_temp: 10
max_temp: 100 

